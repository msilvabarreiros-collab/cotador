<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotador de Proteção – Brasil Trade Agro</title>
<style>
:root{color-scheme:dark;--ac3:#1b6fe0;--glow:rgba(47,140,255,.4);--bg:#050b14;--card:rgba(16,30,50,.72);--line:rgba(120,160,210,.16);--tx:#eaf1fb;--mu:#8aa0bb;--ac:#2f8cff;--ac2:#22d3ee;--ok:#19d38a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;padding:22px;
background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(34,211,238,.12),transparent 60%),var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px rgba(47,140,255,.4)}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px}
header small{color:var(--mu);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);color:var(--tx);padding:11px 22px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.on{background:linear-gradient(135deg,var(--ac),var(--ac3));border-color:transparent;color:#fff;box-shadow:0 6px 20px var(--glow)}
#sides .btn{min-width:120px}
.main{display:grid;grid-template-columns:270px 1fr;gap:16px}
@media(max-width:800px){.main{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:8px}
.side .btn{border-radius:14px;text-align:left;padding:12px 14px;font-size:13px;line-height:1.3;border-left:3px solid transparent}
.side .btn.on{border-left-color:var(--ac2)}
.panel{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
input,textarea{width:100%;background:rgba(4,10,20,.7);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 13px;font-size:15px;transition:.2s}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,140,255,.2)}
textarea{min-height:340px;font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical}
h3{margin:2px 0 12px;font-size:12px;color:var(--ac2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.copy{margin-top:14px;width:100%;padding:14px;background:linear-gradient(135deg,var(--ok),#10b981);border-color:transparent;color:#03150d;font-size:15px;box-shadow:0 8px 24px rgba(25,211,138,.3)}
.hint{font-size:12px;color:var(--mu);margin:6px 0 0}
.badge{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(34,211,238,.12);color:var(--ac2);border:1px solid rgba(34,211,238,.3)}
.badge.err{background:rgba(255,100,100,.1);color:#ff8a8a;border-color:rgba(255,100,100,.3)}
#fxbox{display:none;margin-bottom:16px}
.hero{position:relative;height:230px;border-radius:22px;margin-bottom:16px;overflow:hidden;border:1px solid var(--line);background-size:cover;background-position:center 40%;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,20,.85) 0%,rgba(5,11,20,.25) 60%,rgba(5,11,20,.05) 100%)}
.htxt{position:absolute;left:26px;bottom:22px;display:flex;align-items:center;gap:16px}
#hico{font-size:44px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac3));box-shadow:0 0 28px var(--glow)}
.hero h2{margin:0;font-size:36px;font-weight:800;letter-spacing:1px;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.hero p{margin:3px 0 0;color:#dbe6f5;font-size:14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@media(max-width:600px){.hero{height:160px}.hero h2{font-size:26px}#hico{width:54px;height:54px;font-size:32px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:rgba(4,10,20,.6);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.kpi b{font-size:18px}
.kpi.hl{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 6px 20px var(--glow)}
.kpi.hl b{color:var(--ac2);font-size:22px}

/* Refinamento visual — preserva a lógica original do cotador */
:root{--bg:#07101c;--card:rgba(15,27,44,.94);--line:rgba(159,186,220,.16);--tx:#f2f6fc;--mu:#9cacc2}
body{padding:32px 24px 60px;background:radial-gradient(ellipse 75% 42% at 85% 0%,rgba(35,104,174,.19),transparent),linear-gradient(145deg,#081321,#060b13 72%);line-height:1.5}
.wrap{max-width:1320px}header{margin-bottom:30px;padding:0 2px;gap:16px}.logo{width:54px;height:54px;border-radius:16px;font-size:25px}h1{font-size:25px;letter-spacing:-.7px}header small{font-size:11px;letter-spacing:1.25px}
.row{gap:9px;margin-bottom:18px}.btn{background:#14243a;border:1px solid rgba(157,188,223,.18);padding:11px 19px;font-weight:650;letter-spacing:.1px}.btn:hover{background:#1b314d;box-shadow:0 5px 18px rgba(0,0,0,.18)}.btn.on{box-shadow:0 5px 20px var(--glow)}
#assets{padding:5px 0 2px}#assets .btn{border-radius:12px}#sides{padding:4px;background:rgba(12,23,39,.85);border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}#sides .btn{border:0;border-radius:10px;min-width:135px}
.hero{height:246px;border-radius:20px;margin-bottom:23px;border-color:rgba(255,255,255,.13)}.hero .shade{background:linear-gradient(90deg,rgba(4,11,21,.95),rgba(4,11,21,.55) 52%,rgba(4,11,21,.06))}.htxt{left:30px;bottom:27px}.hero h2{font-size:38px;letter-spacing:-.7px}.hero p{font-size:13px;letter-spacing:.5px}#hico{border-radius:17px;width:66px;height:66px;font-size:34px}
.main{grid-template-columns:285px minmax(0,1fr);gap:20px;align-items:start}.side{position:sticky;top:18px;gap:8px;padding:9px;background:rgba(12,23,39,.65);border:1px solid var(--line);border-radius:18px}.side .btn{border-radius:11px;border-left:0;text-align:left;padding:15px 16px;line-height:1.45;background:transparent;color:#b9c9de}.side .btn:hover{background:rgba(79,143,216,.13)}.side .btn.on{border-left:0;background:linear-gradient(110deg,var(--ac),var(--ac3));color:white}
.panel{padding:27px;border-radius:19px;box-shadow:0 18px 45px rgba(0,0,0,.22)}h3{font-size:11px;letter-spacing:1.65px;margin:7px 0 15px;color:var(--ac2)}h3:not(:first-child){border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}label{font-size:11px;letter-spacing:.65px;margin-bottom:7px}input,textarea{background:#091522;border:1px solid rgba(156,187,223,.22);border-radius:10px;padding:13px 14px;font-family:inherit;font-size:15px}input:hover,textarea:hover{border-color:rgba(156,187,223,.42)}input:focus,textarea:focus{background:#0b1a2b}.badge{margin-top:9px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kpi{padding:17px 18px;background:#0a1829;border-radius:12px}.kpi span{margin-bottom:8px}.kpi b{font-size:22px;letter-spacing:-.5px}.kpi.hl{background:linear-gradient(125deg,rgba(28,91,151,.22),rgba(12,30,50,.9))}.kpi.hl b{font-size:26px}textarea{min-height:390px;line-height:1.7;font-family:Consolas,monospace;font-size:12.5px}.copy{border-radius:11px;margin-top:12px;font-size:13px;letter-spacing:1px;padding:16px;box-shadow:none}.copy:hover{background:#38e2a3;box-shadow:0 8px 22px rgba(25,211,138,.18)}
@media(max-width:850px){body{padding:18px 13px 40px}.main{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:20px}.hero{height:195px}.hero h2{font-size:29px}}
@media(max-width:520px){h1{font-size:21px}header small{font-size:9px}.logo{width:46px;height:46px}.hero{height:165px}.htxt{left:17px;bottom:17px;gap:10px}.hero h2{font-size:25px}#hico{width:49px;height:49px;font-size:26px}.grid{grid-template-columns:1fr}.side{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px}.kpi b,.kpi.hl b{font-size:17px}#assets .btn{flex:1 1 42%;padding:10px}#sides{width:100%}#sides .btn{flex:1;min-width:0}}

#assets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}#assets .btn{min-height:88px;border-radius:15px;text-align:left;font-size:16px;padding:18px;background:linear-gradient(120deg,rgba(4,29,45,.88),rgba(6,48,57,.7));border:1px solid #177b8177;box-shadow:inset 0 -28px 45px #00121b66}#assets .btn.on{border-color:#12dfad;box-shadow:inset 0 0 0 1px #12dfad,0 7px 25px #00a97a33;background:linear-gradient(125deg,#064a46,#062332)}#assets .btn:last-child{min-height:44px;font-size:13px;grid-column:1/-1;width:max-content}
.main{grid-template-columns:270px minmax(0,1fr)}.side{background:rgba(2,18,32,.94);border-color:#14616b66;padding:13px}.side .btn{background:transparent;border-color:transparent;color:#b8d4e0;min-height:48px}.side .btn.on{background:linear-gradient(90deg,#075e51,#05303c);color:#8fffe1;border-left-color:#1ce8ac}.panel{background:linear-gradient(135deg,rgba(4,28,46,.96),rgba(2,17,30,.96));border:1px solid #125c6b88;box-shadow:0 22px 55px #0007}h3{color:#47e7c0}input,textarea{background:#051e31;border-color:#17566b;color:#e9faff}input:focus,textarea:focus{border-color:#0adba5;box-shadow:0 0 0 3px #00bc8c22}.kpi{background:#041c2e;border-color:#135266}.kpi.hl{border-color:#06ca95;background:linear-gradient(120deg,#063d39,#042a31)}.kpi.hl b{color:#3df0bf}.btn.on{background:linear-gradient(120deg,#05835f,#09c991);box-shadow:0 5px 18px #00aa7d33}.copy{background:linear-gradient(100deg,#07885d,#12d7a1);color:#fff;border:0}.badge{color:#52eac5;background:#063c3b;border-color:#127b6c}
@media(max-width:850px){body{padding:15px 12px 35px;background-size:auto 360px}header{min-height:95px}#assets{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:1fr}.hero{height:185px}}@media(max-width:520px){header h1{font-size:20px}header small{font-size:8px;letter-spacing:1.3px}#assets .btn{min-height:65px;padding:12px;font-size:13px}.hero h2{font-size:27px}.panel{padding:17px}}

<body>
<div class="wrap"><header><div class="logo">◈</div><div><h1>BRASIL <span style="font-weight:400">TRADE AGRO</span></h1><small>TERRA INVESTIMENTOS &nbsp; • &nbsp; COTADOR DE PROTEÇÃO</small></div></header>

<div class="row" id="assets"></div>
<div class="hero" id="hero"><div class="shade"></div><div class="htxt"><div id="hico"></div><div><h2 id="hname"></h2><p id="hsub"></p></div></div></div>
<div class="panel" id="fxbox">
  <h3>Cotação do dólar</h3>
  <div class="grid">
    <div><label>Dólar (R$)</label><input id="fx" inputmode="decimal" value="5,40"></div>
    <div style="align-self:end"><button class="btn" id="fxbtn" type="button">Buscar dólar atual</button></div>
  </div>
  <p class="hint" id="fxmsg">Usado na conversão para real de Café e Soja (contratos em US$).</p>
</div>

<div class="row" id="sides"></div>

<div class="main">
  <div class="side" id="strats"></div>
  <div class="panel">
    <h3>Dados do contrato</h3>
    <div class="grid" id="common"></div>
    <h3>Strikes e prêmios</h3>
    <div class="grid" id="legs"></div>
    <h3>Resumo</h3>
    <div class="kpis" id="kpis"></div>
    <h3>Mensagem / memória de cálculo</h3>
    <textarea id="out"></textarea>
    <button class="btn copy" id="copy" type="button">COPIAR MENSAGEM</button>
  </div>
</div></div>

function venc(c){const m=String(c||"").toUpperCase().replace(/\s/g,"").match(/^[A-Z0-9]{2,4}?([FGHJKMNQUVXZ])(\d{2}|\d{4})$/);if(!m)return null;return MESES[m[1]]+"/"+(m[2].length===2?"20"+m[2]:m[2])}
const S={asset:"BOI",side:"PUT",st:0,v:{}};
const $=id=>document.getElementById(id);
const num=x=>{let s=String(x==null?"":x).trim();if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?0:n};
const nf=(n,d=2)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=n=>(n<0?"-":"")+"R$ "+nf(Math.abs(n));

function defaults(){
  const a=ASSETS[S.asset];
  S.v={ativo:a.ativo,cot:a.cot,vol:String(a.vol),qtd:"10",corr:"0,15",k1:"",k2:"",k3:"",p1:"",p2:""};
  if(S.asset==="BOI"){Object.assign(S.v,{k1:"390,00",k2:"397,00",k3:"390,00",p1:"4,50",p2:"4,00"})}
}

  }else if(k==="MILHO"){
    g=`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2547"/><stop offset=".6" stop-color="#f0a53a"/><stop offset="1" stop-color="#f8d86a"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#a)"/><circle cx="200" cy="170" r="60" fill="#fff1b0" opacity=".85"/><rect y="235" width="${W}" height="65" fill="#7a5a12"/>`;
    for(let i=0;i<46;i++){const x=i*27+r()*14,h=110+r()*90,y=270;g+=`<g><rect x="${x}" y="${y-h}" width="5" height="${h}" fill="#4f7a1c"/><path d="M${x} ${y-h*.5} q-40 -20 -50 -60 q40 10 50 40z M${x+5} ${y-h*.65} q40 -20 52 -60 q-42 10 -52 40z" fill="#6aa12a"/><ellipse cx="${x+14}" cy="${y-h*.55}" rx="8" ry="22" fill="#f5c518" transform="rotate(12 ${x+14} ${y-h*.55})"/></g>`}
  }else if(k==="CAFE"){
    g=`<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0806"/><stop offset="1" stop-color="#6b1d14"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#a)"/>`;
    for(let i=0;i<34;i++){const x=r()*W,y=r()*H,s=.7+r()*1.1,a=r()*180;g+=`<g transform="translate(${x},${y}) rotate(${a}) scale(${s})"><ellipse rx="34" ry="22" fill="#4a2414"/><path d="M-30 0 Q0 -14 30 0" stroke="#1a0b06" stroke-width="4" fill="none"/></g>`}
    for(let i=0;i<22;i++){const x=r()*W,y=r()*H,s=10+r()*10;g+=`<circle cx="${x}" cy="${y}" r="${s}" fill="#d42a2a" opacity=".9"/><circle cx="${x-s*.3}" cy="${y-s*.3}" r="${s*.25}" fill="#ff8a8a" opacity=".7"/>`}
  }else{
    g=`<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06210f"/><stop offset="1" stop-color="#3f8f24"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#a)"/>`;
    for(let i=0;i<20;i++){const x=r()*W,y=r()*H,a=r()*360;g+=`<ellipse cx="${x}" cy="${y}" rx="${40+r()*30}" ry="${18+r()*10}" fill="#2f7a1e" opacity=".7" transform="rotate(${a} ${x} ${y})"/>`}
    for(let i=0;i<22;i++){const x=r()*W,y=r()*H,a=r()*360;g+=`<g transform="translate(${x},${y}) rotate(${a})"><rect x="-42" y="-14" width="84" height="28" rx="14" fill="#a7c957"/><circle cx="-20" cy="0" r="9" fill="#d9ed92"/><circle cx="2" cy="0" r="9" fill="#d9ed92"/><circle cx="24" cy="0" r="9" fill="#d9ed92"/></g>`}
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
}
function theme(){
  const t=THEME[S.asset],a=ASSETS[S.asset],b=document.body.style;
  b.setProperty("--ac",t.ac);b.setProperty("--ac2",t.ac2);b.setProperty("--ac3",t.ac3);b.setProperty("--glow",t.glow);
  $("hero").style.backgroundImage=`url("${PHOTOS[S.asset]}"),url("data:image/svg+xml;utf8,${encodeURIComponent(scene(S.asset))}")`;
  $("hico").textContent=t.ico;$("hname").textContent=a.nome.toUpperCase();$("hsub").textContent="B3  •  Contrato Futuro  •  "+a.un;
}
function btns(el,items,cur,fn){
  el.innerHTML="";
  items.forEach(([key,label])=>{const b=document.createElement("button");b.type="button";b.className="btn"+(key===cur?" on":"");b.textContent=label;b.onclick=()=>fn(key);el.appendChild(b)});
}
function field(id,label,ph){return `<div><label>${label}</label><input data-k="${id}" inputmode="decimal" placeholder="${ph||""}" value="${S.v[id]||""}"></div>`}
function render(){
  const a=ASSETS[S.asset],st=STRATS[S.side][S.st];
  theme();
  btns($("assets"),Object.keys(ASSETS).map(k=>[k,THEME[k].ico+" "+ASSETS[k].nome.toUpperCase()]).concat([["FX","💵 COTAÇÃO DÓLAR"]]),S.asset,k=>{
    if(k==="FX"){const b=$("fxbox");b.style.display=b.style.display==="block"?"none":"block";return}
    S.asset=k;S.st=0;defaults();render()});
  btns($("sides"),[["CALL","CALL"],["PUT","PUT"]],S.side,k=>{S.side=k;S.st=0;render()});
  btns($("strats"),STRATS[S.side].map((s,i)=>[i,s.n]),S.st,i=>{S.st=i;render()});
  $("common").innerHTML=`<div><label>Ativo (contrato)</label><input data-k="ativo" placeholder="Ex.: BGIX26" value="${S.v.ativo||""}"><span class="badge" id="venc"></span></div>`+field("cot","Cotação atual ("+a.un+")")+field("vol","Volume do contrato")+field("qtd","Quantidade de contratos")+field("corr","Corretagem (%)");
  const t=S.side, ex=st.ex;
  let h="";
  if(st.k==="s"){h=field("k1","Strike ("+a.un+")")+field("p1","Custo do prêmio ("+a.un+")")}
  else if(st.k==="p"){h=field("k1","Strike 1 – protegido")+field("k2","Strike 2 – máx. proteção")+field("p1","Prêmio líquido do spread")}
  else{h=field("k1","Strike 1 – protegido")+field("k2","Strike 2 – máx. proteção")+field("k3","Strike da "+ex+" – risco")+field("p1","Prêmio líquido do spread")+field("p2","Prêmio da "+ex)}
  $("legs").innerHTML=h;
  document.querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{S.v[i.dataset.k]=i.value;calc()});
  calc();
}
function calc(){
  const a=ASSETS[S.asset],st=STRATS[S.side][S.st],v=S.v;
  const vc0=venc(v.ativo),bd=$("venc");
  if(bd){bd.textContent=vc0?"Vencimento: "+vc0:"Vencimento não identificado";bd.className="badge"+(vc0?"":" err")}
  const fx=a.conv?num($("fx").value):1, u=a.conv?"US$":"R$";
  const q=num(v.qtd),vc=num(v.vol),vol=q*vc,corr=num(v.corr)/100;
  const fin=k=>vol*num(k)*fx;
  const sg=st.sg;
  let prem,premTxt=[],strikes=[];
  if(st.k==="s"){prem=sg*num(v.p1);strikes=[["Strike",v.k1,"Volume financeiro "+(sg>0?"protegido":"exposto")]];}
  else if(st.k==="p"){prem=sg*num(v.p1);strikes=[["Strike 1",v.k1,"Volume financeiro protegido"],["Strike 2",v.k2,"Volume financeiro máx. de proteção"]];}
  else{prem=sg*num(v.p1)-sg*num(v.p2);strikes=[["Strike 1",v.k1,"Volume financeiro protegido"],["Strike 2",v.k2,"Volume financeiro máx. de proteção"],["Strike "+st.ex,v.k3,"Volume financeiro risco"]];}
  const premFin=prem*vol*fx;
  let m=`*COTAÇÃO DE PROTEÇÃO – ${a.nome.toUpperCase()}*\n${st.n}\n\n`;
  m+=`Contrato: ${v.ativo||"-"}${vc0?" (venc. "+vc0+")":""}  |  Cotação atual: ${u} ${nf(num(v.cot))}\n`;
  m+=`Contratos: ${nf(q,0)} x ${nf(vc,0)} = ${nf(vol,0)}\n`;
  if(a.conv)m+=`Dólar: R$ ${nf(fx,4)} (valores convertidos para real)\n`;
  m+=`\n*VOLUME FINANCEIRO*\n`;
  strikes.forEach(([l,k,t])=>{m+=`${nf(vol,0)} x ${u} ${nf(num(k))}${a.conv?" x "+nf(fx,4):""} = ${brl(fin(k))}  (${t})\n`});
  m+=`\n*PRÊMIO ${prem<0?"(CRÉDITO)":"(CUSTO)"}*\n`;
  m+=`${nf(vol,0)} x ${u} ${nf(prem)}${a.conv?" x "+nf(fx,4):""} = ${brl(premFin)}\n`;
  m+=`\n*CUSTO OPERACIONAL (${nf(corr*100)}%)*\n`;
  let cost=0;
  strikes.forEach(([l,k])=>{const c=fin(k)*corr;cost+=c;m+=`${brl(fin(k))} x ${nf(corr*100)}% = ${brl(c)}  (contrato de ${nf(num(k))})\n`});
  const tot=premFin+cost,un=S.asset==="BOI"?"arroba":"saca",pu=vol?premFin/vol:0,cu=vol?cost/vol:0,tu=vol?tot/vol:0;
  m+=`\n*TOTAL (prêmio + custo operacional): ${brl(tot)}*`;
  m+=`\n\n*CUSTO POR ${un.toUpperCase()}*\n`;
  m+=`Prêmio: ${brl(premFin)} ÷ ${nf(vol,0)} = ${brl(pu)}\n`;
  m+=`Custo operacional: ${brl(cost)} ÷ ${nf(vol,0)} = ${brl(cu)}\n`;
  m+=`*Total: ${brl(tot)} ÷ ${nf(vol,0)} = ${brl(tu)} por ${un}*`;
  if(a.conv&&fx)m+=`\n(equivale a US$ ${nf(tu/fx)} por saca)`;
  $("kpis").innerHTML=`<div class="kpi"><span>Prêmio total</span><b>${brl(premFin)}</b></div><div class="kpi"><span>Custo operacional</span><b>${brl(cost)}</b></div><div class="kpi"><span>Total</span><b>${brl(tot)}</b></div><div class="kpi hl"><span>Custo por ${un}</span><b>${brl(tu)}</b></div>`;
  $("out").value=m;
}
$("fx").oninput=calc;
$("fxbtn").onclick=async()=>{
  try{
    const r=await fetch("https://economia.awesomeapi.com.br/last/USD-BRL");
    const j=await r.json();const b=parseFloat(j.USDBRL.bid);
    $("fx").value=nf(b,4);$("fxmsg").textContent="Dólar atualizado: R$ "+nf(b,4);calc();
  }catch(e){$("fxmsg").textContent="Não foi possível buscar agora. Digite o valor manualmente."}
};
$("copy").onclick=async()=>{
  const t=$("out");
  try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand("copy")}
  $("copy").textContent="MENSAGEM COPIADA ✓";setTimeout(()=>$("copy").textContent="COPIAR MENSAGEM",1800);
};
defaults();render();
</script>
</body>
</html>
